<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;

      object-fit: cover;
      object-position: center;

      display: block;
    }
  </style>
</head>

<body>

  <video
    autoplay
    playsinline
    controls
    preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>

</body>
</html>
